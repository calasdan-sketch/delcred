[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "delcred"
version = "0.4.0"
description = "Short-lived, per-task, per-user-scoped credentials for AI agents — RFC 8693 delegation + ephemeral API-key broker"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Calas Automations Inc." }]
keywords = ["agents", "oauth", "delegation", "credentials", "zero-trust", "rfc8693"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = [
    "PyJWT>=2.8",
    "cryptography>=41",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/calasdan-sketch/delcred"
Source = "https://github.com/calasdan-sketch/delcred"
Issues = "https://github.com/calasdan-sketch/delcred/issues"
Changelog = "https://github.com/calasdan-sketch/delcred/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
delcred = "delcred.cli:main"

[tool.setuptools.package-data]
delcred = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["delcred*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true
files = ["delcred"]
